name: Release assets

# Builds the branded `usingopen-<platform>-<arch>` binaries for the targets a
# dev machine cannot build (everything except linux-x64) with the repository's
# own Bazel cross toolchains, runs each one on its own platform, and uploads
# them to an existing GitHub release. Manual only: the scheduled release
# pipeline in ci.yml needs the self-hosted runner pool and npm credentials this
# fork does not have.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to upload to (e.g. v18.8.9)"
        required: true
        default: "v18.8.9"
      smoke:
        description: "Run every binary on its own platform before uploading"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Everything except linux-x64, which is built and published from the dev
  # machine. gnu and musl x64 addons share canonical filenames, so each target
  # is staged into its own destination before an addon is embedded.
  CROSS_TARGETS: natives-darwin-arm64 natives-darwin-x64-baseline natives-linux-arm64 natives-linux-musl-arm64 natives-linux-musl-x64-baseline natives-win32-arm64 natives-win32-x64-baseline

jobs:
  addons:
    name: Build cross-target native addons
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install bazelisk
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          bazelisk version
      - name: Build addons
        run: |
          set -eo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          # One addon per invocation: each link peaks at several GiB of rustc
          # RSS, and a single multi-target invocation runs them concurrently.
          for target in $CROSS_TARGETS; do
            bazelisk build "//:$target"
          done
          for target in $CROSS_TARGETS; do
            mkdir -p "addons-bundle/$target"
            cp -L bazel-bin/"$target"/*.node "addons-bundle/$target/"
          done
          find addons-bundle -name '*.node' -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addons-cross
          path: addons-bundle
          if-no-files-found: error
          retention-days: 2

  binaries:
    name: "Build binary: ${{ matrix.target_id }}"
    needs: addons
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target_id: darwin-x64, native_targets: darwin-x64-baseline, binary: usingopen-darwin-x64 }
          - { target_id: darwin-arm64, native_targets: darwin-arm64, binary: usingopen-darwin-arm64 }
          - { target_id: linux-arm64, native_targets: linux-arm64, binary: usingopen-linux-arm64 }
          - { target_id: linux-musl-x64, native_targets: linux-musl-x64-baseline, binary: usingopen-linux-musl-x64 }
          - { target_id: linux-musl-arm64, native_targets: linux-musl-arm64, binary: usingopen-linux-musl-arm64 }
          - { target_id: win32-x64, native_targets: win32-x64-baseline, binary: usingopen-windows-x64.exe }
          - { target_id: win32-arm64, native_targets: win32-arm64, binary: usingopen-windows-arm64.exe }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addons-cross
          path: staged
      - name: Stage this target's addon
        run: |
          set -euo pipefail
          if [ ! -d staged/bazel-bin ]; then
            mkdir -p staged/bazel-bin
            mv staged/natives-* staged/bazel-bin/
          fi
          bun scripts/bazel-natives.ts ${{ matrix.native_targets }} \
            --source staged --dest packages/natives/native
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usingopen-binary-${{ matrix.target_id }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 2

  smoke:
    name: "Smoke binary: ${{ matrix.target_id }}"
    needs: binaries
    if: ${{ inputs.smoke }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target_id: linux-arm64, binary: usingopen-linux-arm64 }
          - { os: ubuntu-22.04, target_id: linux-musl-x64, binary: usingopen-linux-musl-x64, alpine: true }
          - { os: ubuntu-24.04-arm, target_id: linux-musl-arm64, binary: usingopen-linux-musl-arm64, alpine: true }
          - { os: macos-15-intel, target_id: darwin-x64, binary: usingopen-darwin-x64 }
          - { os: macos-15, target_id: darwin-arm64, binary: usingopen-darwin-arm64 }
          - { os: windows-2025, target_id: win32-x64, binary: usingopen-windows-x64.exe }
          - { os: windows-11-arm, target_id: win32-arm64, binary: usingopen-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usingopen-binary-${{ matrix.target_id }}
          path: binaries
      - name: Smoke binary
        if: runner.os != 'Windows' && !matrix.alpine
        env:
          BINARY: binaries/${{ matrix.binary }}
        run: |
          set -euo pipefail
          chmod +x "$BINARY"
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
      - name: Smoke binary (Alpine)
        if: matrix.alpine
        env:
          BINARY: binaries/${{ matrix.binary }}
        run: |
          chmod +x "$BINARY"
          docker run --rm -v "$(realpath "$BINARY"):/usr/local/bin/usingopen:ro" alpine:3.22 sh -ec '
            apk add --no-cache libstdc++ libgcc >/dev/null
            runtime_dir="$(mktemp -d)"
            HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" usingopen --version
            HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" usingopen --smoke-test
          '
      - name: Smoke binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: binaries/${{ matrix.binary }}
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "usingopen-smoke"
          $env:HOME = Join-Path $runtimeDir "home"
          $env:USERPROFILE = $env:HOME
          $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
          $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
          New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
          & $env:BINARY --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BINARY --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Upload assets to the GitHub release
    needs: [binaries, smoke]
    if: ${{ always() && needs.binaries.result == 'success' && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usingopen-binary-*
          path: packages/coding-agent/binaries
          merge-multiple: true
      # SHA256SUMS.txt must cover every asset in the release, including the
      # linux-x64 binary published from the dev machine.
      - name: Fetch the already-published linux-x64 binary
        run: gh release download "$TAG" --pattern usingopen-linux-x64 --dir packages/coding-agent/binaries
      - name: Generate checksums
        run: |
          bun run ci:release:checksums SHA256SUMS.txt \
            packages/coding-agent/binaries/usingopen-* \
            LICENSE \
            THIRD-PARTY-NOTICES.txt
      - name: Upload assets
        run: gh release upload "$TAG" packages/coding-agent/binaries/usingopen-* SHA256SUMS.txt --clobber
