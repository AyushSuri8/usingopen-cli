<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f3" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

		<title>UsingOpen collab — live agent session in your browser</title>
		<meta
			name="description"
			content="Guest client for UsingOpen collab sessions: watch a live coding-agent session — streaming transcript, tool calls, subagents — and prompt the host agent from any browser. End-to-end encrypted; the room key never leaves the URL fragment."
		/>
		<meta name="author" content="UsingOpen" />
		<link rel="canonical" href="https://relay.usingopen.com/" />
		<meta name="robots" content="index, follow, max-image-preview:large" />

		<link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./public/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="256x256" href="./public/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./public/favicon-180x180.png" />
		<link rel="manifest" href="./public/manifest.webmanifest" />

		<!-- Open Graph -->
		<meta property="og:site_name" content="UsingOpen" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://relay.usingopen.com/" />
		<meta property="og:title" content="UsingOpen collab — live agent session in your browser" />
		<meta
			property="og:description"
			content="Watch a live usingopen session and prompt the host agent from any browser. End-to-end encrypted; the key stays in the URL fragment."
		/>
		<meta property="og:image" content="https://relay.usingopen.com/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="UsingOpen collab — your agent, live in any browser" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://relay.usingopen.com/" />
		<meta name="twitter:title" content="UsingOpen collab — live agent session in your browser" />
		<meta
			name="twitter:description"
			content="Watch a live usingopen session and prompt the host agent from any browser. End-to-end encrypted; the key stays in the URL fragment."
		/>
		<meta name="twitter:image" content="https://relay.usingopen.com/og-image.png" />
		<meta name="twitter:image:alt" content="UsingOpen collab — your agent, live in any browser" />

		<!-- Structured data: WebApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "UsingOpen collab",
				"url": "https://relay.usingopen.com/",
				"applicationCategory": "DeveloperApplication",
				"operatingSystem": "Any",
				"description": "Browser guest client for UsingOpen collab live sessions: streaming transcript, tool calls, subagent panel, and a composer that prompts the host agent. End-to-end encrypted.",
				"isPartOf": { "@type": "WebSite", "name": "UsingOpen", "url": "https://usingopen.com/" },
				"publisher": {
					"@type": "Organization",
					"@id": "https://usingopen.com/#organization",
					"name": "UsingOpen",
					"legalName": "UsingOpen",
					"alternateName": "UsingOpen",
					"url": "https://usingopen.com/"
				}
			}
		</script>

		<!-- No third-party analytics: the relayout E2E room key lives in the URL
		     fragment, and the collab client is local-first. A future usingopen
		     analytics property can be injected here when self-hosted. -->
	</head>
	<body>
		<div id="root"></div>
		<script>
			(function () {
				try {
					var s = localStorage.getItem("usingopen-collab-theme");
					var sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					var t = s === "light" || s === "dark" ? s : sys;
					document.documentElement.dataset.theme = t;
					document.documentElement.style.colorScheme = t;
				} catch (e) {}
			})();
		</script>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
